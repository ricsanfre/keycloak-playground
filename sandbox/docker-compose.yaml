  #     context: ./ch2/backend
  #   container_name: test-app-backend
  #   environment:
  #     KC_URL: http://localhost:8080/auth
  #   ports:
  #     - 3000:3000
  #   restart: unless-stopped
  #   networks:
  #     - frontend
