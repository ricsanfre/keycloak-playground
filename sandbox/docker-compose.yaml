  #   container_name: test-app-frontend
  #   ports: 
  #     - 8000:8000
  #   restart: unless-stopped
  #   depends_on:
  #     - backend
  #   networks:
  #     - frontend
  oidc-playground:
    image: oidc-playground
    build: 
      context: ../ch4
    environment:
      KC_URL: http://${KEYCLOAK_HOSTNAME}:8080
    container_name: oidc-playground
    restart: unless-stopped
    ports:
      - 8001:8000
    networks:
      - backend
    extra_hosts:
     - ${KEYCLOAK_HOSTNAME}:host-gateway

  oauth2-playground-backend:
    image: oauth2-playground-backend
    build: 
      context: ../ch5/backend
    environment:
      KC_URL: http://${KEYCLOAK_HOSTNAME}:8080
    container_name: oauth2-playground-backend
    restart: unless-stopped
    networks:
      - backend
    ports:
      - 3000:3000
    extra_hosts:
     - ${KEYCLOAK_HOSTNAME}:host-gateway
  
  oauth2-playground-frontend:
    image: oauth2-playground-frontend
    build: 
      context: ../ch5/frontend
    environment:
      KC_URL: http://${KEYCLOAK_HOSTNAME}:8080
      SERVICE_URL: http://${KEYCLOAK_HOSTNAME}:3000/secured
    container_name: oauth2-playground-frontend
    depends_on:
      - oauth2-playground-backend
    restart: unless-stopped
    ports:
      - 8000:8000
    networks:
      - backend


volumes:
  postgres_data:
    driver: local

networks:
  frontend:
    external: true
  backend:
    external: true
